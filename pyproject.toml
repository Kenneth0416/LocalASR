[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meeting-realtime-voice"
version = "0.1.0"
description = "Local-first meeting transcription assistant with realtime QA and summaries."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi==0.115.0",
  "uvicorn[standard]==0.32.0",
  "websockets==12.0",
  "numpy>=1.26.0",
  "requests>=2.32.0",
  "soundfile>=0.12.1",
  "langchain-core==1.2.23",
  "langchain-openai==1.1.12",
  "langchain-ollama==1.0.1",
  "mlx>=0.22.0",
  "mlx-audio>=0.1.0",
  "mlx-lm>=0.22.0",
  "webrtcvad-wheels==2.0.14",
  "python-dotenv>=1.0.0",
]

[project.scripts]
meeting-realtime-voice = "server:main"

[tool.setuptools]
py-modules = ["asr_utils", "asr", "asr_service", "asr_types", "chunker", "config", "mlx_transcriber", "persistence", "server", "server_app", "session", "text_utils", "vad", "ws_handler"]
